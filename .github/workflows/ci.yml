name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: python -m cybershelf.demo --output runs/demo-data
      - run: cybershelf train --main runs/demo-data/main.parquet --extra runs/demo-data/extra.parquet --targets runs/demo-data/targets.parquet --output runs/smoke --folds 2 --iterations 8 --xgb-iterations 8 --epochs 2 --batch-size 128
      - run: cybershelf predict --main runs/demo-data/test.parquet --extra runs/demo-data/test_extra.parquet --model runs/smoke --output runs/predictions.parquet
